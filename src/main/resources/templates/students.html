<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f8fb;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 32px 40px 40px 40px;
        }
        h1 {
            color: #2d6cdf;
            text-align: center;
            margin-bottom: 32px;
        }
        a.button {
            display: inline-block;
            background: #2d6cdf;
            color: #fff;
            padding: 10px 22px;
            border-radius: 5px;
            text-decoration: none;
            margin-bottom: 18px;
            font-weight: 500;
            transition: background 0.2s;
        }
        a.button:hover {
            background: #1a4e9b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #f9fbfd;
        }
        th, td {
            padding: 12px 10px;
            text-align: center;
        }
        th {
            background: #e3eefd;
            color: #2d6cdf;
            font-size: 1.08em;
        }
        tr:nth-child(even) {
            background: #f1f6fa;
        }
        tr:hover {
            background: #eaf2fb;
        }
        .actions a {
            margin: 0 6px;
            color: #2d6cdf;
            text-decoration: none;
            font-weight: 500;
        }
        .actions a:hover {
            text-decoration: underline;
            color: #1a4e9b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student List</h1>
        <a href="/students/add" class="button">+ Add Student</a>
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Sex</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.age}"></td>
                <td th:text="${student.sex}"></td>
                <td th:text="${student.address}"></td>
                <td class="actions">
                    <a th:href="@{'/students/edit/' + ${student.id}}">Edit</a>
                    <a th:href="@{'/students/delete/' + ${student.id}}">Delete</a>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
